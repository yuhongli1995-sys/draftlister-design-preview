<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DraftLister · 前后对比</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e4d8;color:#203d33;font:13px Arial}header{padding:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,a{border:1px solid #203d3355;padding:10px;color:inherit;background:#f5f1e5;text-decoration:none;cursor:pointer}button.active{background:#203d33;color:#fff}#viewport{margin:auto;overflow:hidden;background:white}iframe{border:0;display:block;transform-origin:top left}p{padding:0 18px;font-size:11px}</style><header><b>DraftLister / 对比预览</b><button id="new" class="active">Design Final</button><button id="old">Hybrid V3</button><button id="desktop">桌面 1280</button><button id="small">手机 320</button><button id="mobile">手机 390</button><button id="short">手机短屏 390×620</button><a href="design-final.html?v=323cc81">直接体验 ↗</a><a href="design-final-notes.html">出处与验收</a></header><p>仅改造 Hero 与核心工作区。可在框内滚动、点击卡片和编辑和复制示例草稿。切换版本会重置进度。</p><div id="viewport"><iframe title="交互原型" src="design-final.html?v=323cc81"></iframe></div><p id="metrics"></p><script>let width=1280,height=720;const frame=document.querySelector('iframe');function fit(){const scale=Math.min(1,(innerWidth-20)/width,(innerHeight-165)/height);frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';document.querySelector('#viewport').style.width=width*scale+'px';document.querySelector('#viewport').style.height=height*scale+'px'}function version(src,id){frame.src=src;document.querySelectorAll('#new,#old').forEach(b=>b.classList.toggle('active',b.id===id))}document.querySelector('#new').onclick=()=>version('design-final.html?v=323cc81','new');document.querySelector('#old').onclick=()=>version('hybrid-v3.html','old');document.querySelector('#small').onclick=()=>{width=320;height=740;fit()};document.querySelector('#desktop').onclick=()=>{width=1280;height=720;fit()};document.querySelector('#mobile').onclick=()=>{width=390;height=740;fit()};document.querySelector('#short').onclick=()=>{width=390;height=620;fit()};function metrics(){const d=frame.contentDocument;if(d)document.querySelector('#metrics').textContent='视口 '+d.documentElement.clientWidth+'×'+d.documentElement.clientHeight+'px · 内容宽 '+d.documentElement.scrollWidth+'px'}frame.onload=metrics;setInterval(metrics,1000);addEventListener('resize',fit);fit();</script></html>
