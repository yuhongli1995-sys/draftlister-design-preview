<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DraftLister · Design Final 对比</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e4d8;color:#203d33;font:13px Arial}header{padding:15px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,a{border:1px solid #203d3355;padding:10px;color:inherit;background:#f5f1e5;text-decoration:none;cursor:pointer}button.active{background:#203d33;color:#fff}#viewport{margin:auto;overflow:hidden;background:white}iframe{border:0;display:block;transform-origin:top left}p{padding:0 16px;font-size:12px}</style><header><b>DraftLister / Design Final</b><button id="final" class="active">Design Final</button><button id="v3">Hybrid V3</button><button id="desktop">桌面 1280</button><button id="small">手机 320</button><button id="mobile">手机 390</button><a href="design-final.html">直接体验 ↗</a><a href="design-final-notes.html">动效与验收 ↗</a></header><p>只比较 Hero 与核心工作区的最终视觉精修。可在框内操作上传、编辑、复制并切换结果；所有生成结果仍清楚标注为固定示例。</p><div id="viewport"><iframe title="Design Final 与 Hybrid V3 对比" src="design-final.html"></iframe></div><p id="metrics"></p><script>let width=1280;const frame=document.querySelector('iframe');function fit(){const height=width<=390?740:720;const scale=Math.min(1,(innerWidth-20)/width,(innerHeight-160)/height);frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';document.querySelector('#viewport').style.width=width*scale+'px';document.querySelector('#viewport').style.height=height*scale+'px'}function version(src,id){frame.src=src;document.querySelectorAll('#final,#v3').forEach(b=>b.classList.toggle('active',b.id===id))}document.querySelector('#final').onclick=()=>version('design-final.html','final');document.querySelector('#v3').onclick=()=>version('hybrid-v3.html','v3');document.querySelector('#small').onclick=()=>{width=320;fit()};document.querySelector('#desktop').onclick=()=>{width=1280;fit()};document.querySelector('#mobile').onclick=()=>{width=390;fit()};function metrics(){const d=frame.contentDocument;if(d)document.querySelector('#metrics').textContent='模拟视口 '+d.documentElement.clientWidth+'px · 内容宽 '+d.documentElement.scrollWidth+'px'}frame.onload=metrics;setInterval(metrics,1500);addEventListener('resize',fit);fit()</script></html>
